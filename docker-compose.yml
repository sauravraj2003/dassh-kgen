
services:

  postgres:
    image: postgres:16-alpine
    container_name: dassh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dassh
      POSTGRES_PASSWORD: dassh_secret
      POSTGRES_DB: dassh_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dassh -d dassh_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dassh_backend
    restart: unless-stopped
    ports:
      - "7700:7700"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7700/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:7700
    container_name: dassh_frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
